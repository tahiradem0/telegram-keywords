<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Keyword Notifier</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <h1>Telegram Keyword Notifier</h1>
                
                <div class="tab-container">
                    <button class="tab-button active" id="loginTab">Login</button>
                    <button class="tab-button" id="signupTab">Sign Up</button>
                </div>

                <form id="loginForm" class="form active">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>

                <form id="signupForm" class="form">
                    <input type="email" id="signupEmail" placeholder="Email" required>
                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="screen">
            <header class="dashboard-header">
                <h1>Keyword Notifier</h1>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </header>

            <div class="dashboard-content">
                <!-- Telegram Login Section -->
                <div class="section">
                    <h2>Telegram Connection</h2>
                    <div id="telegramStatus" class="telegram-status">
                        <span>Not connected</span>
                        <button id="connectTelegramBtn" class="btn-primary">Connect Telegram</button>
                    </div>
                </div>

                <!-- Keyword Management -->
                <div class="section">
                    <h2>Keywords to Monitor</h2>
                    <div class="keyword-input">
                        <input type="text" id="newKeyword" placeholder="Enter keyword to monitor">
                        <button id="addKeywordBtn" class="btn-primary">Add Keyword</button>
                    </div>
                    <div id="keywordsList" class="keywords-list"></div>
                </div>

                <!-- Detected Messages -->
                <div class="section">
                    <h2>Detected Messages</h2>
                    <div id="messagesList" class="messages-list"></div>
                </div>
            </div>
        </div>

        <!-- Telegram Login Modal -->
        <div id="telegramModal" class="modal">
            <div class="modal-content">
                <h2>Connect Telegram Account</h2>
                <div id="telegramSteps">
                    <div class="step active" id="step1">
                        <p>Enter your phone number (with country code):</p>
                        <input type="text" id="phoneNumber" placeholder="+251978787960" required>
                        <button id="sendCodeBtn" class="btn-primary">Send Code</button>
                    </div>
                    <div class="step" id="step2">
                        <p>Enter the verification code:</p>
                        <input type="text" id="verificationCode" placeholder="12345" required>
                        <button id="verifyCodeBtn" class="btn-primary">Verify</button>
                    </div>
                </div>
                <button id="closeModal" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
